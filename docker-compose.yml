services:
  app:
    build: .
    ports:
      # Host port comes from HTTP_PORT in .env (default 8080).
      # Inside the container the process always listens on 8080.
      - "0.0.0.0:${HTTP_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      HTTP_ADDR: :8080
    volumes:
      - ./data:/data
    restart: unless-stopped
    # SQLite files live on the host at ./data. The app needs write access
    # to that directory (Compose runs the process as root so a normal
    # mkdir -p data is enough).
